name: Deploy database

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref_name == 'main' && 'production' || 'homologation' }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify deployment revision
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7

      - name: Install test dependencies
        run: python -m pip install --require-hashes --requirement requirements-test.txt

      - name: Run quality checks
        shell: bash
        run: |
          set -Eeuo pipefail
          coverage_file="${RUNNER_TEMP}/garageflow-database.coverage"
          python -m coverage run --branch --data-file="${coverage_file}" --source=scripts --omit='scripts/tests/*' \
            -m unittest discover -s scripts/tests -v
          python -m coverage run --branch --data-file="${coverage_file}" --append --source=scripts --omit='scripts/tests/*' \
            -m unittest discover -s tests -v
          python -m coverage report --data-file="${coverage_file}" --fail-under=80
          terraform fmt -check -recursive infra
          terraform -chdir=infra/database init -backend=false -input=false
          terraform -chdir=infra/database validate
          terraform -chdir=infra/database test
          bash -n scripts/deploy-database.sh

  deploy:
    name: Apply database root and publish metadata
    needs: quality
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/develop' && vars.HOMOLOGATION_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_expires_on: ${{ vars.TF_EXPIRES_ON }}
      TF_VAR_allow_database_destroy: ${{ vars.TF_ALLOW_DATABASE_DESTROY || 'false' }}
      TF_VAR_final_snapshot_identifier: ${{ vars.TF_FINAL_SNAPSHOT_IDENTIFIER }}
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'

    steps:
      - name: Checkout trusted deployment revision
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7

      - name: Deploy database
        shell: bash
        run: scripts/deploy-database.sh
