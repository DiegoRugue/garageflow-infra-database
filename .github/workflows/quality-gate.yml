name: Quality gate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Contract and Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7

      - name: Install test dependencies
        run: python -m pip install --require-hashes --requirement requirements-test.txt

      - name: Test Python infrastructure boundaries with coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          coverage_file="${RUNNER_TEMP}/garageflow-database.coverage"
          python -m coverage run --branch --data-file="${coverage_file}" --source=scripts --omit='scripts/tests/*' \
            -m unittest discover -s scripts/tests -v
          python -m coverage run --branch --data-file="${coverage_file}" --append --source=scripts --omit='scripts/tests/*' \
            -m unittest discover -s tests -v
          python -m coverage report --data-file="${coverage_file}" --fail-under=80

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/database init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra/database validate

      - name: Run credential-free Terraform tests
        run: terraform -chdir=infra/database test

      - name: Validate deployment script syntax
        run: bash -n scripts/deploy-database.sh
